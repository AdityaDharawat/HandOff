name: Extension
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: python -m pip install -r scripts/vsix-build-requirements.txt
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run build
        working-directory: vscode-extension
      - name: Build twice and verify identical VSIX bytes
        working-directory: vscode-extension
        run: |
          npm run package -- --out first.vsix
          python ../scripts/verify_vsix.py first.vsix --normalize
          mkdir -p ../dist
          name="handoff-project-intelligence-$(node -p 'require("./package.json").version').vsix"
          npm run build
          npm run package -- --out "../dist/$name"
          cd ../dist
          python ../scripts/verify_vsix.py "$name" --normalize > SHA256SUMS
          cmp ../vscode-extension/first.vsix "$name"
      - run: python -m build --sdist --no-isolation --outdir dist
      - name: Record rehearsal artifact checksums
        working-directory: dist
        run: |
          version=$(node -p 'require("../vscode-extension/package.json").version')
          vsix="handoff-project-intelligence-$version.vsix"
          python ../scripts/verify_vsix.py "$vsix" --extract-engine .
          sha256sum --binary -- "handoff_continuity-$version.tar.gz" \
            "handoff_continuity-$version-py3-none-any.whl" "$vsix" > REHEARSAL_SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handoff-vsix
          path: |
            dist/*.vsix
            dist/SHA256SUMS
            dist/*.tar.gz
            dist/*.whl
            dist/REHEARSAL_SHA256SUMS
          if-no-files-found: error

  engine-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: handoff-vsix
          path: dist
      - run: python scripts/smoke_vsix_engine.py dist
